# SPDX-License-Identifier: MIT
#
# Runs the test suite on every push to main and on every pull request.
#
# `check` builds every check of the flake on x86_64-linux and on
# aarch64-linux, each on a runner of its own system, among them the
# conformance-* checks of the purifier contract and the real-world project
# (credo). It then runs the two contract checks the sandbox cannot run:
# conformance-messages, which reads the message of each failing lockfile,
# and conformance-rebuild, `nix build --rebuild` of a fixture. `relock` runs
# the online lock run on every fixture and fails if a lockfile changes, and
# conformance-update, which updates a fixture that pins an old version.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the checks
        run: nix flake check -L
      - name: conformance-messages
        run: bash tests/conformance-messages.sh
      - name: conformance-rebuild
        run: |
          release=".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).basic-release"
          nix build --no-link "$release"
          nix build --no-link --rebuild "$release"

  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Relock every fixture online
        run: bash tests/relock-online.sh
      - name: conformance-update
        run: bash tests/conformance-update.sh
