# SPDX-License-Identifier: MIT
#
# Runs the flake's checks on every push to main and on every pull request.
# The checks build for x86_64-linux, the runner's system, and evaluate for
# every system the flake supports.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the checks
        run: nix flake check -L
      - name: Evaluate the checks for every system
        run: nix flake check --all-systems --no-build
